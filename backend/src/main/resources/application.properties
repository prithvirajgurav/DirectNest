server.port=${PORT:8080}
spring.application.name=DirectNest

# ============================================================
# DATABASE - MySQL
# ============================================================

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:directnest}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ============================================================
# JWT
# ============================================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}


# ============================================================
# CORS
# ============================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# ============================================================
# FILE UPLOAD
# ============================================================

app.upload.dir=${FILE_UPLOAD_DIR:../uploads}
app.upload.max-file-size=5MB
app.upload.allowed-image-types=image/jpeg,image/png,image/webp
app.upload.allowed-document-types=application/pdf,image/jpeg,image/png


# ============================================================
# SPRING FILE UPLOAD LIMITS
# ============================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB


# ============================================================
# LOGGING
# ============================================================

logging.level.com.directnest=INFO
logging.level.org.springframework.security=WARN